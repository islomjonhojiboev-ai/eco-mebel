<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eco Mebel</title>
</head>
<body>
  <h1>Eco Mebel</h1>
  <p>by Islomjon Hojiboev</p>

  <h2>Kirish</h2>

  <input id="email" type="email" placeholder="Email manzil">
  <br><br>

  <input id="password" type="password" placeholder="Parol">
  <br><br>

  <button id="loginBtn" type="button">Kirish</button>

  <p id="xabar"></p>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDRohvTKAXBa1y8IywkUZD00ZmKgw746Ug",
      authDomain: "eco-mebel.firebaseapp.com",
      projectId: "eco-mebel",
      storageBucket: "eco-mebel.firebasestorage.app",
      messagingSenderId: "55907548196",
      appId: "1:55907548196:web:318de523be887425feecb1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const xabar = document.getElementById("xabar");

      xabar.textContent = "Urinish...";
      xabar.style.color = "blue";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        xabar.textContent = "Muvaffaqiyatli kirdingiz!";
        xabar.style.color = "green";
      } catch (error) {
        console.error("Login xatolik:", error);
        xabar.textContent = "Xatolik: " + error.code + " - " + error.message;
        xabar.style.color = "red";
      }
    });
  </script>
</body>
</html>
