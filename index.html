<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eco Mebel</title>
</head>
<body>
  <h1>Eco Mebel</h1>
  <p>by Islomjon Hojiboev</p>

  <section id="loginSection">
    <h2>Kirish</h2>

    <input id="email" type="email" placeholder="Email manzil">
    <br><br>

    <input id="password" type="password" placeholder="Parol">
    <br><br>

    <button id="loginBtn" type="button">Kirish</button>
    <p id="xabar"></p>
  </section>

  <section id="asosiySahifa" style="display: none;">
    <hr>
    <h2>Eco Mebel bosh sahifasi</h2>
    <p id="foydalanuvchiEmail"></p>
    <p>Saytga xush kelibsiz!</p>
    <h3>Zakaz berish</h3>

<form id="zakazForm">
  <input id="ism" type="text" placeholder="Ismingiz" required>
  <br><br>

  <input id="telefon" type="tel" placeholder="Telefon raqamingiz" required>
  <br><br>

  <textarea id="mebel" placeholder="Qanday mebel kerak?" required></textarea>
  <br><br>

  <input id="olcham" type="text" placeholder="O‘lchami">
  <br><br>

  <textarea id="izoh" placeholder="Qo‘shimcha izoh"></textarea>
  <br><br>

  <button type="submit">Zakaz yuborish</button>
</form>

<p id="zakazXabar"></p>
    <section id="zakazlarBolimi" hidden>
  <h2>Zakazlar ro‘yxati</h2>
  <p id="zakazlarHolati"></p>

  <div style="overflow-x: auto;">
    <table border="1" cellpadding="8"
           style="border-collapse: collapse; width: 100%;">
      <thead>
        <tr>
          <th>Zakaz raqami</th>
          <th>Ism</th>
          <th>Telefon</th>
          <th>Mebel</th>
          <th>O‘lcham</th>
          <th>Izoh</th>
          <th>Holat</th>
          <th>Sana</th>
        </tr>
      </thead>
      <tbody id="zakazlarJadvali"></tbody>
    </table>
  </div>
</section>
    <button id="logoutBtn" type="button">Chiqish</button>
<script>
  window.addEventListener("error", function(event) {
    alert(
      "Tekshiruv: " +
      (event.message || "Skript yuklanmadi") +
      "\nQator: " + (event.lineno || "noma’lum")
    );
  });

  window.addEventListener("unhandledrejection", function(event) {
    const error = event.reason;

    alert(
      "Tekshiruv: " +
      (error && error.message ? error.message : String(error))
    );
  });
</script>

  <script type="module">
    
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  runTransaction,onSnapshot
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDRohvTKAXBa1y8IywkUZD00ZmKgw746Ug",
      authDomain: "eco-mebel.firebaseapp.com",
      projectId: "eco-mebel",
      storageBucket: "eco-mebel.firebasestorage.app",
      messagingSenderId: "55907548196",
      appId: "1:55907548196:web:318de523be887425feecb1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const zakazForm = document.getElementById("zakazForm"); const zakazXabar = document.getElementById("zakazXabar"); const zakazTugma = zakazForm.querySelector('button[type="submit"]');
zakazForm.addEventListener("submit", async (event) => { event.preventDefault();
const user = auth.currentUser;
if (!user) { zakazXabar.style.color = "red"; zakazXabar.textContent = "Avval dasturga kiring."; return; }
const ism = document.getElementById("ism").value.trim(); const telefon = document.getElementById("telefon").value.trim(); const mebel = document.getElementById("mebel").value.trim(); const olcham = document.getElementById("olcham").value.trim(); const izoh = document.getElementById("izoh").value.trim();
if (!ism  ||!telefon || !mebel) {
  zakazXabar.style.color = "red";
  zakazXabar.textContent = "Ism, telefon va mebel maydonlarini to‘ldiring.";
  return;
}
zakazTugma.disabled = true; zakazXabar.style.color = "blue"; zakazXabar.textContent = "Zakaz saqlanmoqda...";
try { const hisoblagichRef = doc(db, "hisoblagichlar", "zakazlar"); const yangiZakazRef = doc(collection(db, "zakazlar"));
const zakazRaqami = await runTransaction(db, async (transaction) => { const hisoblagich = await transaction.get(hisoblagichRef);
const oxirgiRaqam = hisoblagich.exists()
  ? hisoblagich.data().oxirgiRaqam
  : 0;

if (!Number.isSafeInteger(oxirgiRaqam) || oxirgiRaqam < 0) {
  throw new Error("Hisoblagich qiymati noto‘g‘ri.");
}

const yangiRaqam = oxirgiRaqam + 1;

transaction.set(hisoblagichRef, {
  oxirgiRaqam: yangiRaqam
});

transaction.set(yangiZakazRef, {
  zakazRaqami: yangiRaqam,
  ism: ism,
  telefon: telefon,
  mebel: mebel,
  olcham: olcham,
  izoh: izoh,
  userId: user.uid,
  holat: "yangi",
  yaratilganVaqt: serverTimestamp()
});

return yangiRaqam;
});
zakazXabar.style.color = "green"; zakazXabar.textContent = "Zakaz saqlandi! Zakaz raqami: " + String(zakazRaqami).padStart(4, "0");
zakazForm.reset(); } catch (error) { zakazXabar.style.color = "red"; zakazXabar.textContent = "Zakaz saqlanmadi. Xatolik: " + (error.code || error.message); } finally { zakazTugma.disabled = false; } });

  
    const loginSection = document.getElementById("loginSection");
    const asosiySahifa = document.getElementById("asosiySahifa");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const xabar = document.getElementById("xabar");
    const foydalanuvchiEmail = document.getElementById("foydalanuvchiEmail");

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      xabar.textContent = "Urinish...";
      xabar.style.color = "blue";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        xabar.textContent = "Muvaffaqiyatli kirdingiz!";
        xabar.style.color = "green";
      } catch (error) {
        xabar.textContent = "Xatolik: " + String(error);
        xabar.style.color = "red";
      }
    });
const zakazlarBolimi = document.getElementById("zakazlarBolimi"); const zakazlarHolati = document.getElementById("zakazlarHolati"); const zakazlarJadvali = document.getElementById("zakazlarJadvali");
let zakazlarniToxtatish = null;
onAuthStateChanged(auth, (user) => { if (zakazlarniToxtatish) { zakazlarniToxtatish(); zakazlarniToxtatish = null; }
zakazlarJadvali.replaceChildren(); zakazlarHolati.textContent = ""; zakazlarBolimi.hidden = true;
if (!user) { loginSection.style.display = "block"; asosiySahifa.style.display = "none"; foydalanuvchiEmail.textContent = ""; zakazXabar.textContent = ""; zakazForm.reset(); return; }
loginSection.style.display = "none"; asosiySahifa.style.display = "block"; foydalanuvchiEmail.textContent = "Kirdingiz: " + user.email;
zakazlarBolimi.hidden = false; zakazlarHolati.textContent = "Zakazlar yuklanmoqda...";
zakazlarniToxtatish = onSnapshot( collection(db, "zakazlar"), (snapshot) => { if (auth.currentUser?.uid !== user.uid) return;
  zakazlarJadvali.replaceChildren();

  const zakazlar = snapshot.docs.map((hujjat) => hujjat.data());

  zakazlar.sort((a, b) => {
    return (b.zakazRaqami ?? 0) - (a.zakazRaqami ?? 0);
  });

  zakazlarHolati.textContent = zakazlar.length
    ? "Jami zakazlar: " + zakazlar.length
    : "Hozircha zakazlar yo‘q.";

  for (const zakaz of zakazlar) {
    const raqam = Number.isInteger(zakaz.zakazRaqami)
      ? String(zakaz.zakazRaqami).padStart(4, "0")
      : "Eski zakaz";

    const sana = zakaz.yaratilganVaqt?.toDate
      ? zakaz.yaratilganVaqt.toDate().toLocaleString("uz-UZ")
      : "—";

    const qiymatlar = [
      raqam,
      zakaz.ism ?? "—",
      zakaz.telefon ?? "—",
      zakaz.mebel ?? "—",
      zakaz.olcham ?? "—",
      zakaz.izoh ?? "—",
      zakaz.holat ?? "—",
      sana
    ];

    const qator = document.createElement("tr");

    for (const qiymat of qiymatlar) {
      const katak = document.createElement("td");
      katak.textContent = String(qiymat);
      qator.appendChild(katak);
    }

    zakazlarJadvali.appendChild(qator);
  }
},
(error) => {
  if (auth.currentUser?.uid !== user.uid) return;

  zakazlarJadvali.replaceChildren();
  zakazlarHolati.textContent =
    "Zakazlarni yuklashda xatolik: " + error.code;
}
); });
    

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      xabar.textContent = "Siz tizimdan chiqdingiz.";
      xabar.style.color = "blue";
    });
  </script>
</body>
</html>
